# One Windows job of the "account groups" custom build.
#
# Libraries take many hours on a free runner, longer than one job may run.
# So the libraries step stops itself in time, everything built so far is
# cached, and the next job continues from that cache. The final job builds
# AyuGram itself from the finished libraries.

name: Account groups Windows job.

on:
  workflow_call:
    inputs:
      part:
        type: string
        required: true
      build:
        type: boolean
        default: false
    outputs:
      done:
        description: All libraries are built.
        value: ${{ jobs.windows.outputs.done }}

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 (${{ inputs.part }})
    runs-on: windows-latest
    timeout-minutes: 355

    outputs:
      done: ${{ steps.libraries.outcome == 'success' }}

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Submodules.
        shell: bash
        run: |
          cd $TBUILD/$REPO_NAME
          git submodule update --init --depth=1

      - name: First set up.
        shell: bash
        run: |
          # breakpad's dump_syms tool needs ATL for the 14.44 toolset, which
          # the runner lacks, and it's only used to upload crash symbols.
          python - "$TBUILD/$REPO_NAME/$PREPARE_PATH" <<'PY'
          import sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              lines = f.readlines()
          kept = [line for line in lines if 'dump_syms' not in line]
          print('Removed', len(lines) - len(kept), 'dump_syms lines.')
          with open(path, 'w', encoding='utf-8', newline='') as f:
              f.writelines(kept)
          PY

          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-ag-third-party-${{ env.CACHE_KEY }}-none
          restore-keys: ${{ runner.os }}-ag-third-party-${{ env.CACHE_KEY }}-

      - name: Libraries cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-ag-libs-${{ env.CACHE_KEY }}-none
          restore-keys: ${{ runner.os }}-ag-libs-${{ env.CACHE_KEY }}-

      - name: Qt cache.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-ag-qt-${{ env.CACHE_KEY }}-none
          restore-keys: ${{ runner.os }}-ag-qt-${{ env.CACHE_KEY }}-

      - name: Libraries.
        id: libraries
        continue-on-error: ${{ !inputs.build }}
        timeout-minutes: 290
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Free up some disk space.
        if: always()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty cache.
        if: always() && !inputs.build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-ag-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.part }}

      - name: Save Libraries cache.
        if: always() && !inputs.build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-ag-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.part }}

      - name: Save Qt cache.
        if: always() && !inputs.build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-ag-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.part }}

      # Same API credentials as the official AyuGram build, so the existing
      # sessions keep working exactly as they are. No auto-update, so the
      # official updater never replaces this build.
      # The compiler ran out of memory (C1060) with the small default
      # pagefile, so give it a big one on the roomy D: drive.
      - name: Bigger pagefile.
        if: inputs.build
        uses: al-cheb/configure-pagefile-action@9b6da52fb72a3c6147c1aad2df22d8d905681adc # v1.5
        with:
          minimum-size: 16GB
          maximum-size: 40GB
          disk-root: "D:"

      - name: AyuGram configure.
        if: inputs.build
        run: |
          mkdir D:\tmp
          echo TEMP=D:\tmp>>%GITHUB_ENV%
          echo TMP=D:\tmp>>%GITHUB_ENV%
          rem At most 3 compiler processes at once, to fit in memory.
          echo _CL_=/MP3>>%GITHUB_ENV%
          powershell -Command "Get-PSDrive C,D | ForEach-Object { Write-Host ('::notice::Before build, drive ' + $_.Name + ' free ' + [math]::Round($_.Free/1GB,1) + ' GB') }"
          rem The C: drive is nearly full on this runner, D: has plenty.
          mkdir %GITHUB_WORKSPACE%\ayu-out
          mklink /J %TBUILD%\%REPO_NAME%\out %GITHUB_WORKSPACE%\ayu-out
          if errorlevel 1 exit /b 1
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=2040 ^
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      # Errors are also reported as annotations, readable without the log.
      - name: AyuGram build.
        if: inputs.build
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME/out"
          set +e
          # One project at a time (each still compiles on all cores), to fit in RAM.
          cmake --build . --config Release --target Telegram 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          powershell -Command "Get-PSDrive C,D | ForEach-Object { Write-Host ('::notice::After build, drive ' + \$_.Name + ' free ' + [math]::Round(\$_.Free/1GB,1) + ' GB') }"
          if [ "$status" != "0" ]; then
            set +e +o pipefail
            grep -E ': (fatal )?error|error LNK|No space' build.log \
              | grep -v 'error C1085\|error D8040' \
              | sort -u | head -9 \
              | sed -e 's/%/%25/g' -e 's/\r//g' \
              | while IFS= read -r line; do echo "::error::$line"; done
            grep -c 'No space' build.log | sed 's/^/::error::No-space lines: /'
          fi
          exit $status

      - name: Collect the result.
        if: inputs.build
        shell: bash
        run: |
          OUT="$TBUILD/$REPO_NAME/out/Release"
          ls -la "$OUT"
          mkdir -p artifact
          cp "$OUT"/*.exe artifact/
          ls -la artifact

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        name: Upload the result.
        if: inputs.build
        with:
          name: AyuGram-account-groups
          path: artifact\
          retention-days: 30
